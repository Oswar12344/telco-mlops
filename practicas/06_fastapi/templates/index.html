<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telco — Predictor de abandono</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#12223b;background:#f2f6fb}main{background:white;max-width:640px;margin:32px auto;padding:30px;border-radius:14px;box-shadow:0 3px 20px #1c254018}label{display:block;margin:13px 0;font-weight:600}input,select,button{display:block;width:100%;padding:11px;margin-top:5px;border:1px solid #becadc;border-radius:7px;box-sizing:border-box;font-size:15px}button{background:#174ea6;color:white;font-weight:650;cursor:pointer;margin-top:18px}pre{white-space:pre-wrap;background:#eaf2ff;padding:16px;border-radius:8px}.hint{color:#59677a;font-size:14px}</style></head>
<body><main><h1>Predicción de abandono</h1><p class="hint">Telco Customer Churn · Ejercicio educativo con el dataset CSV aportado por el docente.</p>
<form id="f">
<label>Antigüedad (meses)<input name="tenure" type="number" min="0" max="100" value="5" required></label>
<label>Cargo mensual ($)<input name="MonthlyCharges" type="number" min="0" max="10000" step="0.01" value="85.50" required></label>
<label>Cargo total ($)<input name="TotalCharges" type="number" min="0" max="1000000" step="0.01" value="427.50" required></label>
<label>Contrato<select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select></label>
<label>Servicio de internet<select name="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select></label>
<button type="submit">Calcular predicción</button></form><h2>Resultado</h2><pre id="out" role="status">Envía el formulario para ver el resultado.</pre>
<p class="hint">Las probabilidades y bandas son didácticas, no un sistema comercial.</p></main>
<script>document.querySelector('#f').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const field of ['tenure','MonthlyCharges','TotalCharges'])data[field]=Number(data[field]);const out=document.querySelector('#out');out.textContent='Consultando API...';try{const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});out.textContent=JSON.stringify(await response.json(),null,2)}catch(err){out.textContent='Error: '+err.message}});</script></body></html>
